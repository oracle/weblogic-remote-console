baseTypes:
- weblogic.management.runtime.RuntimeMBean
descriptionHTML: 'ManagedThreadFactory Runtime information. It can be the information
  of a partition level MTF, an application level MTF or a regular JSR236 MTF. '
name: weblogic.management.runtime.ManagedThreadFactoryRuntimeMBean
properties:
- defaultValue: {
    }
  descriptionHTML: '<p>Get the name of the application this ManagedThreadFactory is
    associated with</p> '
  name: ApplicationName
  type: java.lang.String
- defaultValue: {
    }
  descriptionHTML: '<p>The number of completed threads.</p> '
  name: CompletedThreadsCount
  type: long
- defaultValue: {
    }
  descriptionHTML: '<p>Get the name of the module this ManagedThreadFactory is associated
    with</p> '
  name: ModuleName
  type: java.lang.String
- defaultValue: {
    }
  descriptionHTML: '<p>Get the name of the partition this ManagedThreadFactory is
    associated with</p> '
  excludeFromRest: ' '
  name: PartitionName
  supported: false
  type: java.lang.String
- defaultValue: {
    }
  descriptionHTML: '<p>The number of newThread method invocations that have been rejected
    because the limit of running threads was exceeded. </p> '
  name: RejectedNewThreadRequests
  type: long
- defaultValue: {
    }
  descriptionHTML: '<p>The number of running threads.</p> '
  name: RunningThreadsCount
  type: int
- defaultValue: {
    }
  descriptionHTML: 'Whether this ManagedThreadFactory currently creates virtual threads.
    <p> This can be <code>false</code> even when the <code>virtual</code> element
    of <code>ManagedThreadFactoryDefinition</code> is configured as <code>true</code>,
    for example when the running JVM does not support virtual threads or virtual threads
    are disabled by the domain-wide configuration. </p> '
  name: UseVirtualThreads
  type: boolean
roles:
  allowed:
  - Operator
