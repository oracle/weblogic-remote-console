      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isWSATRegistrationSecretEnabled
    attribute is disabled. '
  name: WarnOnDisabledWSATRegistrationSecret
  type: boolean
  writable: true
- defaultValue:
