baseTypes:
- weblogic.management.configuration.ConfigurationMBean
descriptionHTML: '<p>Controls the behavior of Secure Mode in the current WebLogic
  Server domain. Attributes control whether secure mode is enabled and control the
  validation that is performed during startup.</p>  <p>The WarnOnDisabled attributes
  for FeatureCompatibilityMBean apply in production domains whether or not secure
  mode is enabled.</p> '
name: weblogic.management.configuration.SecureModeMBean
properties:
- defaultValue:
    value:
      value: true
  descriptionHTML: '<p>Returns whether restrictive policies will be used for JMX authorization.</p>  <p>If
    secure mode is enabled and restrictive policies are enabled, then the default
    policies for JMX only allow MBean access to the standard WLS roles (Admin, Deployer,
    Operator, or Monitor). If changed as part of a non-dynamic activation, then the
    ServerSecurityRuntimeMBean.resetDefaultPolicies method should also be invoked.
    </p> '
  name: RestrictiveJMXPolicies
  type: boolean
  writable: true
- defaultValue:
    derivedDefault: true
  descriptionHTML: '<p>Returns whether the domain will run in secure mode.</p>  <p>In
    secure mode, the configuration defaults are those recommended for securing a domain.
    The authorization policies for JNDI and MBean access are more restrictive in secure
    mode. In addition, WLS will validate the domain configuration and log warnings
    and errors for any insecure settings.</p>  <p> Secure mode requires the domain
    to be in production mode. </p> '
  name: SecureModeEnabled
  restartNeeded: true
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: '<p>Returns whether a warning should be logged if anonymous RMI
    requests are enabled. </p>  <p>If the warning is enabled, then a message will
    be logged if anonymous RMI requests are enabled.</p> '
  name: WarnOnAnonymousRequests
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: '<p>Returns whether warnings should be logged if auditing not enabled.
    </p>  <p>If secure mode is enabled and warnings are enabled, then messages will
    be logged if auditing is not enabled.</p> '
  name: WarnOnAuditing
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isCrossDomainT3SConnectionTrustValidationEnabled
    attribute is disabled. '
  name: WarnOnDisabledCrossDomainT3SConnectionTrustValidation
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isIIOPStrictRemoteBusinessInterfaceValidationEnabled
    attribute is disabled. '
  name: WarnOnDisabledIIOPStrictRemoteBusinessInterfaceValidation
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isIIOPTypedReadResolveProxyValidationEnabled
    attribute is disabled. '
  name: WarnOnDisabledIIOPTypedReadResolveProxyValidation
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isIIOPUnauthenticatedServiceContextValueTypeFilteringEnabled
    attribute is disabled. '
  name: WarnOnDisabledIIOPUnauthenticatedServiceContextValueTypeFiltering
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isJAXWSRejectUnknownSEIOperationsEnabled
    attribute is disabled. '
  name: WarnOnDisabledJAXWSRejectUnknownSEIOperations
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isJNDIAdditionalFactoriesAllowListsEnabled
    attribute is disabled. '
  name: WarnOnDisabledJNDIAdditionalFactoriesAllowLists
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isJNDIBindingAuthorizationPolicyEnabled
    attribute is disabled. '
  name: WarnOnDisabledJNDIBindingAuthorizationPolicy
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isJNDIOutboundConnectionsAllowListEnabled
    attribute is disabled. '
  name: WarnOnDisabledJNDIOutboundConnectionsAllowList
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isSAML2StrictArtifactResolutionEnabled
    attribute is disabled. '
  name: WarnOnDisabledSAML2StrictArtifactResolution
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.getSerializedWorkContextMaximumSize
    attribute has a disabled value. '
  name: WarnOnDisabledSerializedWorkContextMaximumSize
  type: boolean
  writable: true
- defaultValue:
