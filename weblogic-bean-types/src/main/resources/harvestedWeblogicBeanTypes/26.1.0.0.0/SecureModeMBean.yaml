  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isWSATIgnoreUnknownReplayCompletionEnabled
    attribute is disabled. '
  name: WarnOnDisabledWSATIgnoreUnknownReplayCompletion
  type: boolean
  writable: true
- defaultValue:
