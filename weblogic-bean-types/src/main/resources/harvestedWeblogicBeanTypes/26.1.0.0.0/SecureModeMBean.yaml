  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isT3LegacyCrossDomainCredentialJVMIDReplayProtectionEnabled
    attribute is disabled. '
  name: WarnOnDisabledT3LegacyCrossDomainCredentialJVMIDReplayProtection
