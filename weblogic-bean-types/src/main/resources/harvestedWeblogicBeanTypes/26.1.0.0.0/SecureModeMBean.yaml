  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isWLDFScriptActionPathRestrictionEnabled
    attribute is disabled. '
  name: WarnOnDisabledWLDFScriptActionPathRestriction
  type: boolean
  writable: true
- defaultValue:
    value:
      value: true
  descriptionHTML: 'Returns whether a warning should be generated when the FeatureCompatibilityMBean.isWLProxyClientCertificateChainValidationEnabled
    attribute is disabled. '
  name: WarnOnDisabledWLProxyClientCertificateChainValidation
  type: boolean
  writable: true
- defaultValue:
