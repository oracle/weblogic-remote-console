baseTypes:
- weblogic.management.configuration.BaseExecutorServiceMBean
descriptionHTML: 'Configuration MBean representing parameters of ManagedScheduledExecutorService
  template. '
name: weblogic.management.configuration.ManagedScheduledExecutorServiceTemplateMBean
properties:
- defaultValue:
    value:
      value: -1
  descriptionHTML: 'Configures queueing behavior used together with jakarta.enterprise.concurrent.ManagedScheduledExecutorDefinition.maxAsync().
    This attribute applies to annotation-configured instances and is therefore defined
    on template MBeans rather than BaseExecutorServiceMBean. <p> When the number of
    running asynchronous tasks reaches maxAsync: </p> <ul> <li>maxQueued &lt; 0 means
    queueing is unbounded.</li> <li>maxQueued == 0 means no queue is used and submissions
    are rejected.</li> <li>maxQueued &gt; 0 means at most maxQueued tasks can wait
    in the queue.</li> </ul> '
  name: MaxQueued
  restartNeeded: true
  type: int
  writable: true
