baseTypes:
- weblogic.management.configuration.SystemResourceMBean
descriptionHTML: '<p>Defines a system-level NoSQL resource backed by a separate descriptor.
  Creation, descriptor changes, targeting changes, and removal are dynamic. Compatible
  provider-property changes drain and replace provider runtimes while preserving application
  manager and repository handles. Changes that affect resource selection or provider
  compatibility, target removal, and resource removal invalidate affected applications.
  Those applications must be fully redeployed before using NoSQL again. A simple application
  stop/start or administration-mode transition does not clear invalidation.</p> '
name: weblogic.management.configuration.NoSQLSystemResourceMBean
properties:
- defaultValue:
    derivedDefault: true
  descriptionHTML: '<p>The name of the file containing this configuration.  This is
    a relative name rooted at <code>DOMAIN_DIR/config</code>.  By default the file
    resides in the <code>nosql</code> subdirectory and derives its name from the bean
    name using the following pattern:</p>  <p><code>&lt;beanName&gt;-nosql.xml</code></p>  <p>Note
    that this is a read-only property that can only be set when the bean is created.</p> '
  name: DescriptorFileName
  nullable: true
  type: java.lang.String
- defaultValue:
    derivedDefault: true
  descriptionHTML: '<p>The user-specified name of this MBean instance.</p>  <p>This
    name is included as one of the key properties in the MBean''s <code>javax.management.ObjectName</code>:</p>  <p><code>Name=<i>user-specified-name</i></code></p> '
  key: true
  name: Name
  nullable: true
  restartNeeded: true
  type: java.lang.String
  writable: true
- defaultValue: {
    }
  descriptionHTML: ' '
  name: NoSQLResource
  relationship: containment
  transient: true
  type: weblogic.j2ee.descriptor.wl.NoSQLResourceBean
roles:
  allowed:
  - Deployer
