introductionHTML: >
  <p>Use this page to perform domain-wide credential management,
  including refreshing certificates and rolling the domain certificate authority.</p>
  <p><b>Note</b>: View the page help for more information.</p>

actions:
- name: certificateAuthorityActions
  label: Manage Certificate Authorities
  actions:
  - name: purgeExpiredCertificateAuthorities
    requiredCapabilities:
    - 26.1.0.0.0OrAfter
  - name: removeCertificateAuthority
    requiredCapabilities:
    - 26.1.0.0.0OrAfter
  - name: rollDomainCertificateAuthority
- name: refreshCertificateActions
  label: Refresh Certificates
  actions:
  - name: refreshServerCertificateAllServers
  - name: refreshServerTrustAllServers
  - name: refreshMachineCertificatesAllMachines
    requiredCapabilities:
    - Before26.1.0.0.0
  - name: refreshMachineTrustAllMachines
    requiredCapabilities:
    - Before26.1.0.0.0
